
services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: accessmap-ai:latest
    container_name: accessmap_ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount model weights directory (pre-download weights here)
      - ./models:/service/models:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - accessmap

  # ── Local MinIO (S3-compatible) ────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: accessmap_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - accessmap

volumes:
  minio_data:

networks:
  accessmap:
    driver: bridge
