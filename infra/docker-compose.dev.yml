name: accessmapvn-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${ACCESSMAP_DB_NAME:-accessmapvn}
      POSTGRES_USER: ${ACCESSMAP_DB_USER:-accessmap}
      POSTGRES_PASSWORD: ${ACCESSMAP_DB_PASSWORD:-accessmap_dev_only}
    ports:
      - "${ACCESSMAP_DB_PORT:-5432}:5432"
    volumes:
      - accessmap-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCESSMAP_DB_USER:-accessmap} -d ${ACCESSMAP_DB_NAME:-accessmapvn}"]
      interval: 5s
      timeout: 5s
      retries: 12

  object-storage:
    image: rustfs/rustfs:1.0.0
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${ACCESSMAP_S3_ACCESS_KEY:-accessmap_dev}
      RUSTFS_SECRET_KEY: ${ACCESSMAP_S3_SECRET_KEY:-accessmap_dev_secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "${ACCESSMAP_S3_PORT:-9000}:9000"
      - "${ACCESSMAP_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - accessmap-objects:/data

  db-viewer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ACCESSMAP_DB_VIEWER_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  accessmap-postgres:
  accessmap-objects:
